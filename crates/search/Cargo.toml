[package]
name = "codemirror-search"
version = "0.1.0"
description = "A Rust port of @codemirror/search: search cursors, queries, find and replace commands and match highlighting"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
codemirror-state = { path = "../state" }
codemirror-view = { path = "../view" }
fancy-regex = "0.18"
gpui.workspace = true
unicode-normalization = "0.1"
