[workspace]
resolver = "2"
members = ["crates/state", "crates/language", "crates/view", "crates/commands", "crates/search", "crates/demo"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = ""
rust-version = "1.86"

[workspace.dependencies]
crop = { version = "0.4", features = ["utf16-metric"] }
unicode-segmentation = "1.13"
gpui = "0.2.2"

# Unoptimized builds of the editor are 20 to 40 times slower than release
# builds; a light optimization level keeps debug builds usable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
